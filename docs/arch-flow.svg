<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#090e23"/>
    </linearGradient>
    <linearGradient id="cbl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b7fff"/>
      <stop offset="100%" stop-color="#7fe9ff"/>
    </linearGradient>
    <linearGradient id="cbl2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fe9ff"/>
      <stop offset="100%" stop-color="#5b7fff"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#5b7fff" opacity="0.8"/>
    </marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#7fe9ff" opacity="0.6"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="320" fill="url(#bg)" rx="12"/>
  <rect width="860" height="320" fill="none" stroke="rgba(91,127,255,0.18)" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11" letter-spacing="4"
    fill="#5b7fff" opacity="0.9">ARCHITECTURE · SCROLL → PROGRESS → WORLD</text>

  <!-- ── NODE STYLES ──
       Box: rx=6, stroke = node colour at 60%
       Label: font-size 11.5, fill = colour
       Sub-label: font-size 9.5, fill #9aa0b8 -->

  <!-- LENIS (source) -->
  <rect x="28" y="58" width="110" height="48" rx="6"
    fill="rgba(91,127,255,0.07)" stroke="rgba(91,127,255,0.45)" stroke-width="1"/>
  <text x="83" y="80" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#7fe9ff">Lenis</text>
  <text x="83" y="96" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">smooth scroll</text>

  <!-- Arrow: Lenis → setProgress -->
  <line x1="138" y1="82" x2="184" y2="82"
    stroke="#5b7fff" stroke-width="1.4" marker-end="url(#arr)" opacity="0.7"/>
  <text x="161" y="76" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="8.5" fill="#5b7fff" opacity="0.7">0→1</text>

  <!-- setProgress + ride.progress (hub) -->
  <rect x="186" y="52" width="136" height="60" rx="6"
    fill="rgba(91,127,255,0.12)" stroke="url(#cbl)" stroke-width="1.5" filter="url(#glow)"/>
  <text x="254" y="78" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#edeff5">ride.ts</text>
  <text x="254" y="94" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">setProgress / SCENES</text>
  <text x="254" y="108" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="#5b7fff" opacity="0.85">useSyncExternalStore</text>

  <!-- Fan-out arrows from hub to consumers -->
  <!-- To Rig.tsx -->
  <line x1="322" y1="70" x2="390" y2="70"
    stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arr)" opacity="0.65"/>
  <!-- To Atmosphere.tsx -->
  <line x1="322" y1="82" x2="390" y2="118"
    stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arr)" opacity="0.65"/>
  <!-- To Sections.tsx -->
  <line x1="322" y1="82" x2="390" y2="170"
    stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arr)" opacity="0.65"/>
  <!-- To PostFX.tsx -->
  <line x1="322" y1="94" x2="390" y2="218"
    stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arr)" opacity="0.65"/>
  <!-- To HUD.tsx -->
  <line x1="322" y1="94" x2="390" y2="264"
    stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arr)" opacity="0.65"/>

  <!-- Consumer boxes -->
  <!-- Rig.tsx -->
  <rect x="392" y="48" width="148" height="44" rx="6"
    fill="rgba(127,233,255,0.05)" stroke="rgba(127,233,255,0.35)" stroke-width="1"/>
  <text x="466" y="68" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#7fe9ff">Rig.tsx</text>
  <text x="466" y="84" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">camera · set pieces · headlight</text>

  <!-- Atmosphere.tsx -->
  <rect x="392" y="98" width="148" height="44" rx="6"
    fill="rgba(255,178,122,0.05)" stroke="rgba(255,178,122,0.3)" stroke-width="1"/>
  <text x="466" y="118" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#ffb27a">Atmosphere.tsx</text>
  <text x="466" y="134" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">sky · sun · day-cycle · lights</text>

  <!-- Sections.tsx -->
  <rect x="392" y="148" width="148" height="44" rx="6"
    fill="rgba(91,127,255,0.05)" stroke="rgba(91,127,255,0.3)" stroke-width="1"/>
  <text x="466" y="168" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#edeff5">Sections.tsx</text>
  <text x="466" y="184" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">DOM overlay · 9 SceneLayers</text>

  <!-- PostFX.tsx -->
  <rect x="392" y="198" width="148" height="44" rx="6"
    fill="rgba(255,126,157,0.05)" stroke="rgba(255,126,157,0.3)" stroke-width="1"/>
  <text x="466" y="218" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#ff7e9d">PostFX.tsx</text>
  <text x="466" y="234" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">bloom · god rays · aberration</text>

  <!-- HUD.tsx -->
  <rect x="392" y="248" width="148" height="44" rx="6"
    fill="rgba(91,127,255,0.05)" stroke="rgba(91,127,255,0.25)" stroke-width="1"/>
  <text x="466" y="268" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#9aa0b8">HUD.tsx</text>
  <text x="466" y="284" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">altitude · nav dots · keyboard</text>

  <!-- Arrows: consumers → shared output box -->
  <line x1="540" y1="70"  x2="594" y2="100"
    stroke="#7fe9ff" stroke-width="1" marker-end="url(#arr2)" opacity="0.45"/>
  <line x1="540" y1="120" x2="594" y2="110"
    stroke="#ffb27a" stroke-width="1" marker-end="url(#arr2)" opacity="0.45"/>
  <line x1="540" y1="170" x2="594" y2="136"
    stroke="#5b7fff" stroke-width="1" marker-end="url(#arr2)" opacity="0.45"/>
  <line x1="540" y1="220" x2="594" y2="158"
    stroke="#ff7e9d" stroke-width="1" marker-end="url(#arr2)" opacity="0.45"/>
  <line x1="540" y1="270" x2="594" y2="175"
    stroke="#9aa0b8" stroke-width="1" marker-end="url(#arr2)" opacity="0.45"/>

  <!-- Output: canvas / DOM -->
  <rect x="596" y="62" width="136" height="152" rx="6"
    fill="rgba(91,127,255,0.06)" stroke="rgba(91,127,255,0.22)" stroke-width="1"/>
  <text x="664" y="90" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="10" letter-spacing="2"
    fill="#5b7fff" opacity="0.7">OUTPUT</text>
  <text x="664" y="114" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="10.5" fill="#edeff5">WebGL Canvas</text>
  <text x="664" y="130" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="#9aa0b8">terrain · road · fog</text>
  <text x="664" y="145" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="#9aa0b8">sky dome · swarm</text>
  <line x1="616" y1="158" x2="712" y2="158"
    stroke="rgba(91,127,255,0.2)" stroke-width="0.8"/>
  <text x="664" y="178" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="10.5" fill="#edeff5">DOM Overlay</text>
  <text x="664" y="195" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="#9aa0b8">chapters · skills</text>
  <text x="664" y="210" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="#9aa0b8">projects · HUD</text>

  <!-- localProgress note -->
  <rect x="596" y="228" width="136" height="38" rx="6"
    fill="rgba(91,127,255,0.04)" stroke="rgba(91,127,255,0.18)" stroke-width="0.8"/>
  <text x="664" y="245" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="10" fill="#7fe9ff" opacity="0.8">localProgress(p, id)</text>
  <text x="664" y="260" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="#9aa0b8">per-scene 0→1 slice</text>

  <!-- world.ts note -->
  <rect x="28" y="134" width="110" height="60" rx="6"
    fill="rgba(127,233,255,0.04)" stroke="rgba(127,233,255,0.28)" stroke-width="1"/>
  <text x="83" y="156" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#7fe9ff">world.ts</text>
  <text x="83" y="172" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">roadX · floorY</text>
  <text x="83" y="186" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">cameraPos · lookTarget</text>
  <!-- world.ts → Rig -->
  <line x1="138" y1="156" x2="392" y2="82"
    stroke="rgba(127,233,255,0.28)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- device.ts note -->
  <rect x="28" y="218" width="110" height="60" rx="6"
    fill="rgba(91,127,255,0.04)" stroke="rgba(91,127,255,0.22)" stroke-width="1"/>
  <text x="83" y="240" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="11.5" fill="#9aa0b8">device.ts</text>
  <text x="83" y="256" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">HIGH vs LOW tier</text>
  <text x="83" y="270" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9.5" fill="#9aa0b8">dpr · segments · postFX</text>

  <!-- bottom note -->
  <text x="430" y="308" text-anchor="middle"
    font-family="ui-monospace,monospace" font-size="9" fill="rgba(154,160,184,0.5)"
    letter-spacing="1">
    single global store · no prop drilling · useSyncExternalStore for tearing-free reads
  </text>
</svg>
