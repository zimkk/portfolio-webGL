<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08102a"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5b7fff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7fe9ff"/>
      <stop offset="70%"  stop-color="#5b7fff"/>
      <stop offset="100%" stop-color="#5b7fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a5e"/>
      <stop offset="100%" stop-color="#0a1230"/>
    </linearGradient>
    <linearGradient id="road1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b7fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5b7fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7fe9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b7fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b7fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <g clip-path="url(#round)">
    <!-- Far mountain range -->
    <polygon
      points="0,32 0,19 5,15 9,11 13,14 16,9 19,14 23,11 27,15 32,19 32,32"
      fill="#0d1a38"/>

    <!-- Near foreground ridge -->
    <polygon
      points="0,32 0,24 6,21 11,23 16,20 21,23 26,21 32,24 32,32"
      fill="#060810"/>

    <!-- Horizon glow blob -->
    <ellipse cx="16" cy="20" rx="14" ry="5" fill="url(#glow)"/>

    <!-- Horizon line -->
    <rect x="0" y="19.5" width="32" height="1" fill="url(#horizon)" opacity="0.9"/>

    <!-- Road — two converging lines to vanishing point at horizon center -->
    <polygon points="12,32 16,20 20,32" fill="url(#road1)" opacity="0.25"/>
    <line x1="16" y1="20" x2="11" y2="32"
      stroke="url(#road1)" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="20" x2="21" y2="32"
      stroke="url(#road1)" stroke-width="0.8" opacity="0.7"/>

    <!-- Summit star / rising sun dot -->
    <circle cx="16" cy="7.5" r="1.6" fill="url(#star)"/>
    <circle cx="16" cy="7.5" r="3.2" fill="url(#glow)" opacity="0.5"/>

    <!-- Thin cyan accent line at very bottom -->
    <rect x="0" y="30.5" width="32" height="1.5" fill="url(#horizon)" opacity="0.7"/>
  </g>
</svg>
